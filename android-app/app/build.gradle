plugins { id 'com.android.application' }

android {
    namespace 'org.iccs.ohda'
    compileSdk 35

    defaultConfig {
        applicationId 'org.iccs.ohda'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
