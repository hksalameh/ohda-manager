name: Android APK CI

on:
  push:
    branches:
      - "integration/**"
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  android:
    name: Build and verify Android client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35 and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK and lint
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify packaged APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk
          grep -q 'android.permission.INTERNET' android-app/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' android-app/app/src/main/AndroidManifest.xml

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ohda-Android-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
