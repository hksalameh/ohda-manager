name: Windows Installer CI

on:
  push:
    branches:
      - "integration/**"
      - "feature/**"
    paths:
      - "desktop/**"
      - "src/**"
      - "prisma/**"
      - "scripts/smoke-windows-package.ps1"
      - "scripts/test-room-audit*.ts"
      - "scripts/test-employee-rooms.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "prisma/**"
      - "scripts/smoke-windows-package.ps1"
      - "scripts/test-room-audit*.ts"
      - "scripts/test-employee-rooms.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: file:./windows-ci.db
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client for Windows
        run: npm run db:generate

      - name: Verify room-audit custody reconciliation on isolated database
        shell: pwsh
        run: |
          New-Item -ItemType Directory .tmp -Force | Out-Null
          $env:DATABASE_URL = 'file:../.tmp/audit-validation.db'
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          npx tsx scripts/test-room-audit.ts
          npx tsx scripts/test-room-audit-posting.ts
          $env:DATABASE_URL = 'file:../.tmp/employee-room-validation.db'
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          npx tsx scripts/test-employee-rooms.ts

      - name: Build web backend bundled into desktop app
        run: npm run build

      - name: Prepare standalone Electron application
        run: npm run desktop:prepare

      - name: Isolate QA app data from production
        shell: pwsh
        run: Set-Content -Path desktop/app/QA_BUILD -Value 'OHDA QA ISOLATED' -Encoding Ascii

      - name: Build QA Windows installer and standalone folder
        run: npx electron-builder --config desktop/qa-builder.js --win nsis dir --x64 --publish never

      - name: Smoke test packaged Windows server and routes
        shell: pwsh
        run: ./scripts/smoke-windows-package.ps1

      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-desktop -File -Filter 'Ohda-Manager-QA*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 20000000) {
            throw "Windows installer not found or suspiciously small"
          }
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List | Out-String | Write-Host
          Write-Host "PASS: Windows installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Ohda-Windows-Installer-QA
          path: dist-desktop/Ohda-Manager-QA*.exe
          if-no-files-found: error
          retention-days: 30
