name: Application CI

on:
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "next-env.d.ts"
      - "postcss.config.mjs"
      - ".env.example"
      - ".github/workflows/database-ci.yml"
  pull_request:
    paths:
      - "prisma/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "next-env.d.ts"
      - "postcss.config.mjs"
      - ".env.example"
      - ".github/workflows/database-ci.yml"

jobs:
  validate-application:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create clean SQLite database
        run: |
          rm -f prisma/ci.db prisma/ci.db-journal
          npm run db:push -- --skip-generate

      - name: Test Excel opening import
        run: npm run test:db

      - name: Test inventory posting rules
        run: npm run test:posting

      - name: Test consistent SQLite backup
        run: |
          rm -rf .tmp/backups
          npm run backup:db -- .tmp/backups
          test "$(find .tmp/backups -maxdepth 1 -name 'ohda-*.db' -type f | wc -l)" -eq 1
          test -s "$(find .tmp/backups -maxdepth 1 -name 'ohda-*.db' -type f | head -n 1)"

      - name: Build Next.js application
        run: npm run build
